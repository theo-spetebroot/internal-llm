name: Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The workflow always runs, so that the required "Docker CI" check is always reported;
  # the stack is only started when something it is built from changed.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.filter.outputs.stack }}
      env: ${{ steps.filter.outputs.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            stack:
              - 'api/**'
              - 'web/**'
              - 'docker-compose.yml'
              - '.github/workflows/docker.yml'
            env:
              - '.env.example'
              - 'docker-compose.yml'
              - 'docker-compose.dev.yml'
              - '.github/workflows/docker.yml'

  # A variable read by a Compose file but missing from .env.example is a setting nobody can
  # discover: fail as soon as one is added without being documented.
  env-example:
    name: Compose variables are documented
    needs: changes
    if: needs.changes.outputs.env == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the variables of the Compose files with .env.example
        run: |
          set -euo pipefail
          sed -nE 's/^([A-Z][A-Z0-9_]*)=.*/\1/p' .env.example | sort -u > documented.txt
          status=0
          for file in docker-compose.yml docker-compose.dev.yml; do
            docker compose -f "$file" config --variables --format json | jq -r 'keys[]' | sort -u > used.txt
            missing="$(comm -23 used.txt documented.txt)"
            if [ -n "$missing" ]; then
              for name in $missing; do
                echo "::error file=.env.example::$name is used by $file but is not documented in .env.example"
              done
              status=1
            fi
            echo "$file: $(wc -l < used.txt) variables, all documented: $([ -z "$missing" ] && echo yes || echo no)"
          done
          exit $status

  e2e:
    name: Compose stack end to end
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built here (rather than by Compose) to reuse the API / Web workflows' build cache. The
      # tags are the image names Compose gives these services.
      - name: Build the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          load: true
          tags: internal-llm-api:latest
          cache-from: type=gha,scope=api
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          load: true
          tags: internal-llm-web:latest
          cache-from: type=gha,scope=web

      - name: Write a throwaway .env
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
          } > .env

      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: API health through Nginx
        run: curl -fsS "$BASE_URL/api/health" | grep -q '"status":"ok"'

      - name: Web client and single-page app fallback
        run: |
          curl -fsS "$BASE_URL/" | grep -q '<div id="root">'
          curl -fsS "$BASE_URL/c/unknown" | grep -q '<div id="root">'

      - name: Create a user, log in and stream an answer through Nginx
        run: |
          password="$(openssl rand -hex 16)"
          printf '%s\n' "$password" |
            docker compose exec -T api node dist/cli/create-user.js --email ci@example.test --name CI
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' \
            -d "{\"email\":\"ci@example.test\",\"password\":\"$password\"}" "$BASE_URL/api/auth/login" > /dev/null
          id="$(curl -fsS -b cookies.txt -H 'Content-Type: application/json' -d '{}' "$BASE_URL/api/conversations" | jq -r .id)"
          curl -fsSN -b cookies.txt -H 'Content-Type: application/json' -d '{"content":"Hello"}' \
            "$BASE_URL/api/conversations/$id/messages" > stream.txt
          grep -q '"type":"delta"' stream.txt
          grep -q '"type":"done"' stream.txt

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # Single, stable check to require in the branch protection of main.
  status:
    name: Docker CI
    needs: [changes, e2e, env-example]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report the result
        env:
          CHANGES: ${{ needs.changes.result }}
          E2E: ${{ needs.e2e.result }}
          ENV_EXAMPLE: ${{ needs.env-example.result }}
        run: |
          echo "changes: $CHANGES, e2e: $E2E, env-example: $ENV_EXAMPLE"
          ok() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }
          [ "$CHANGES" = "success" ] && ok "$E2E" && ok "$ENV_EXAMPLE"
