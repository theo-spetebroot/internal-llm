name: Publish

# Publishes the API, migrate (database migrations, built from api/) and web images to GitHub
# Container Registry at every merge to main, so that the deployment can pull them. All three are
# published at every merge, even when only one project changed: `latest` and `sha-…` then always
# designate a consistent set. If one of the jobs fails, re-run the failed job to bring the set
# back in sync.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a publish in progress; a newer run waits for it.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    # A manual run from another branch must not overwrite `latest`.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: api
            cache_from: api
            cache_to: api
            cache_mode: max
          # Same Dockerfile as the API image, other target. It reads the API cache, which already
          # holds its stages, and only exports its few last layers (to a scope of its own, so as
          # not to overwrite the API one).
          - image: migrate
            context: api
            target: migrate
            cache_from: api
            cache_to: migrate
            cache_mode: min
          # The web build stage is large and cheap to redo: export the final layers only.
          - image: web
            context: web
            cache_from: web
            cache_to: web
            cache_mode: min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name, tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/internal-llm-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          # Links the package to this repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The API and web scopes are the ones of the API / Web workflows.
          cache-from: type=gha,scope=${{ matrix.cache_from }}
          cache-to: type=gha,scope=${{ matrix.cache_to }},mode=${{ matrix.cache_mode }}

      - name: Summary
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Tags:"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
